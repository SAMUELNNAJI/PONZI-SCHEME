# Render Blueprint for PONZI Scheme
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ponzi-scheme
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.5"
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "ponzi-scheme.onrender.com"
      - key: SITE_BASE_URL
        value: "https://ponzi-scheme.onrender.com"
      - key: SITE_URL
        value: "https://ponzi-scheme.onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ponzi-db
          property: connectionString
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_MODE
        value: "live"
      - key: REFERRAL_PERCENT
        value: "10"
      - key: ZEPTOMAIL_CLIENT_ID
        sync: false
      - key: ZEPTOMAIL_CLIENT_SECRET
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false

databases:
  - name: ponzi-db
    databaseName: ponzi
    user: ponzi
    plan: free