{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Admin{% endblock %} – Premium Wallet Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>

  <nav class="dash-nav">
    <a href="/adminpanel/" class="dash-nav-logo">
      <div class="logo-circle" style="background:#dc2626;">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg>
      </div>
      <span class="dash-nav-logo-text">Admin Panel</span>
    </a>
    <div class="dash-nav-right">
      <a href="/dashboard.html" class="btn-dash-admin">View site</a>
      <a href="/logout" class="btn-dash-signout">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </a>
    </div>
  </nav>

  <div class="dash-layout">
    <aside class="dash-sidebar">
      <nav class="sidebar-nav">
        <a href="/adminpanel/users" class="sidebar-link {% block nav_users %}{% endblock %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Users
        </a>
        <a href="/adminpanel/plans" class="sidebar-link {% block nav_plans %}{% endblock %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
          Plans
        </a>
        <a href="/adminpanel/deposits" class="sidebar-link {% block nav_deposits %}{% endblock %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V3"/><path d="M6 11l6 6 6-6"/><path d="M4 21h16"/></svg>
          Deposits
        </a>
        <a href="/adminpanel/withdrawals" class="sidebar-link {% block nav_withdrawals %}{% endblock %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M6 13l6-6 6 6"/><path d="M4 3h16"/></svg>
          Withdrawals
        </a>
        <a href="/adminpanel/transactions" class="sidebar-link {% block nav_transactions %}{% endblock %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><line x1="12" y1="7" x2="12" y2="17"/><path d="M14.8 9.3c-.55-.75-1.55-1.2-2.8-1.2-1.6 0-2.9.85-2.9 2.05 0 2.8 5.8 1.45 5.8 4.25 0 1.2-1.3 2.05-2.9 2.05-1.25 0-2.25-.45-2.8-1.2"/></svg>
          Transactions
        </a>
        <a href="/adminpanel/notify" class="sidebar-link {% block nav_notify %}{% endblock %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Notify
        </a>
        <a href="/adminpanel/settings" class="sidebar-link {% block nav_settings %}{% endblock %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
          Settings
        </a>
        <a href="/adminpanel/logs" class="sidebar-link {% block nav_logs %}{% endblock %}">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
          Logs
        </a>
      </nav>
    </aside>

    <main class="dash-main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- ── MOBILE BOTTOM NAV ── -->
  <nav class="bottom-nav">
    <a href="/adminpanel/users" class="bottom-nav-item {% block nav_users %}{% endblock %}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Users</span>
    </a>
    <a href="/adminpanel/plans" class="bottom-nav-item {% block nav_plans %}{% endblock %}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      <span>Plans</span>
    </a>
    <a href="/adminpanel/deposits" class="bottom-nav-item {% block nav_deposits %}{% endblock %}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V3"/><path d="M6 11l6 6 6-6"/><path d="M4 21h16"/></svg>
      <span>Deposits</span>
    </a>
    <a href="/adminpanel/withdrawals" class="bottom-nav-item {% block nav_withdrawals %}{% endblock %}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M6 13l6-6 6 6"/><path d="M4 3h16"/></svg>
      <span>Withdrawals</span>
    </a>
    <a href="/adminpanel/transactions" class="bottom-nav-item {% block nav_transactions %}{% endblock %}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><line x1="12" y1="7" x2="12" y2="17"/><path d="M14.8 9.3c-.55-.75-1.55-1.2-2.8-1.2-1.6 0-2.9.85-2.9 2.05 0 2.8 5.8 1.45 5.8 4.25 0 1.2-1.3 2.05-2.9 2.05-1.25 0-2.25-.45-2.8-1.2"/></svg>
      <span>Transactions</span>
    </a>
    <a href="/adminpanel/notify" class="bottom-nav-item {% block nav_notify %}{% endblock %}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span>Notify</span>
    </a>
    <a href="/adminpanel/settings" class="bottom-nav-item {% block nav_settings %}{% endblock %}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
      <span>Settings</span>
    </a>
    <a href="/adminpanel/logs" class="bottom-nav-item {% block nav_logs %}{% endblock %}">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span>Logs</span>
    </a>
  </nav>

</body>
</html>
