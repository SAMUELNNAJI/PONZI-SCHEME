{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in – Premium Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'auth.css' %}" />
</head>
<body>

  <!-- Logo -->
  <a href="index.html" class="auth-logo">
    <div class="logo-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
        <polyline points="16 7 22 7 22 13"/>
      </svg>
    </div>
    <span class="auth-logo-text">Premium Wallet</span>
  </a>

  <!-- Card -->
  <div class="auth-card">

    <!-- Tabs -->
    <div class="auth-tabs">
      <a href="login.html"  class="auth-tab active">Sign in</a>
      <a href="signup.html" class="auth-tab">Create account</a>
    </div>

    <!-- Form -->
    <form class="auth-form" method="post">
      {% csrf_token %}
      {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
      <input
        class="auth-input"
        type="email"
        id="email"
        name="email"
        placeholder="Email address"
        autocomplete="email"
        required
      />
      <div class="password-wrapper">
        <input
          class="auth-input"
          type="password"
          id="password"
          name="password"
          placeholder="Password"
          autocomplete="current-password"
          required
        />
      </div>
      <button type="submit" class="btn-auth-submit">Sign in</button>
    </form>

    <p class="auth-footer-link">
      <a href="#">Forgot your password?</a>
    </p>

  </div>

  <script src="main.js"></script>
</body>
</html>
