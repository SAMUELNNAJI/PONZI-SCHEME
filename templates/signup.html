<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account – Premium Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

  <!-- Logo -->
  <a href="index.html" class="auth-logo">
    <div class="logo-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
        <polyline points="16 7 22 7 22 13"/>
      </svg>
    </div>
    <span class="auth-logo-text">Premium Wallet</span>
  </a>

  <!-- Card -->
  <div class="auth-card">

    <!-- Tabs -->
    <div class="auth-tabs">
      <a href="login.html"  class="auth-tab">Sign in</a>
      <a href="signup.html" class="auth-tab active">Create account</a>
    </div>

    <!-- Form -->
    <form class="auth-form" action="dashboard.html" method="get">
      <div class="name-row">
        <input
          class="auth-input"
          type="text"
          id="firstname"
          name="firstname"
          placeholder="First name"
          autocomplete="given-name"
          required
        />
        <input
          class="auth-input"
          type="text"
          id="lastname"
          name="lastname"
          placeholder="Last name"
          autocomplete="family-name"
          required
        />
      </div>
      <input
        class="auth-input"
        type="email"
        id="email"
        name="email"
        placeholder="Email address"
        autocomplete="email"
        required
      />
      <input
        class="auth-input"
        type="tel"
        id="phone"
        name="phone"
        placeholder="Phone number"
        autocomplete="tel"
      />
      <input
        class="auth-input"
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        autocomplete="new-password"
        required
      />
      <input
        class="auth-input"
        type="password"
        id="confirm"
        name="confirm"
        placeholder="Confirm password"
        autocomplete="new-password"
        required
      />
      <button type="submit" class="btn-auth-submit">Create account</button>
    </form>

    <p class="auth-terms">
      By creating an account you agree to our
      <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
    </p>

  </div>

  <script src="main.js"></script>
</body>
</html>
